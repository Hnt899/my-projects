version: "3.9"

services:
  db:
    container_name: aitech-db-prod
    image: postgres
    volumes:
      - ./data/db/:/var/lib/postgresql/data
    restart: always
    networks:
      - postgresnet
    env_file: ./.env.prod
    
  web:
    container_name: aitech-backend-prod
    ports: 
      - "5000:8000"
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - ENVIRONMENT=production
        - SAFETY_API_KEY=${SAFETY_API_KEY}
    env_file: ./.env.prod
    volumes:
      - .:/code
    depends_on:
      - db
    networks:
      - postgresnet
    restart: always
    command: sh start.sh

networks:
  postgresnet: